# Sunscreen & photoprotection surveillance taxonomy
#
# Each topic drives one PubMed query and one OpenAlex query in the weekly sweep.
# Fields:
#   id            stable slug (used as topic_id in ideas/backlog.csv)
#   label         human-readable name
#   pubmed        query string for NCBI E-utilities esearch (db=pubmed).
#                 Topics whose terms overlap large non-dermatology literatures
#                 (plant photobiology, food packaging, polymer weathering,
#                 marine biology) carry a trailing "cutaneous guard":
#                   AND (skin[tiab] OR cutaneous[tiab] OR dermat*[tiab] OR
#                   epiderm*[tiab] OR keratinocyte*[tiab] OR melanocyte*[tiab] OR
#                   fibroblast*[tiab] OR "Skin"[MeSH] OR "Skin Aging"[MeSH] OR
#                   "Skin Neoplasms"[MeSH] OR "Sunburn"[MeSH] OR sunburn[tiab] OR
#                   "sun protection"[tiab] OR "minimal erythema dose"[tiab] OR
#                   photoaging[tiab] OR photoageing[tiab])
#                 and, where materials-science hits recur, a NOT clause of
#                 packaging / agriculture / construction / energy terms. Add the
#                 same guard to any new broad topic. environmental-reef is
#                 deliberately left unguarded (it wants marine/ecotox content).
#   openalex      value for the `search` param of https://api.openalex.org/works.
#                 KEEP SHORT (2-4 core words): OpenAlex requires ALL words to
#                 appear, so long phrases return zero hits.
#   last_reviewed date this topic was last manually assessed for white space (YYYY-MM-DD)
#   known_reviews recent reviews already covering this area (helps spot gaps)
#   notes         freeform

defaults:
  lookback_days: 14
  min_year: 2023
  openalex_mailto: steven.w@stevenwangmd.com   # polite pool = faster, more stable

topics:
  - id: uv-filters-regulatory
    label: UV filters & US/EU regulatory gap; next-generation filters
    pubmed: '("Sunscreening Agents"[MeSH] OR sunscreen*[tiab] OR "UV filter"[tiab] OR "ultraviolet filter*"[tiab]) AND (regulation[tiab] OR regulatory[tiab] OR GRASE[tiab] OR monograph[tiab] OR "Food and Drug Administration"[tiab] OR FDA[tiab] OR "Sunscreen Innovation Act"[tiab] OR bemotrizinol[tiab] OR bisoctrizole[tiab] OR "bis-ethylhexyloxyphenol methoxyphenyl triazine"[tiab] OR "methylene bis-benzotriazolyl tetramethylbutylphenol"[tiab] OR "new UV filter*"[tiab] OR "next-generation filter*"[tiab])'
    openalex: sunscreen filter regulation
    last_reviewed:
    known_reviews: []
    notes: Watch FDA proposed order status, EU SCCS opinions, and Asia-approved filters absent in the US.

  - id: systemic-absorption-safety
    label: Systemic absorption, endocrine questions, benzene/nitrosamine contamination
    pubmed: '(sunscreen*[tiab] OR "Sunscreening Agents"[MeSH] OR oxybenzone[tiab] OR avobenzone[tiab] OR octocrylene[tiab] OR homosalate[tiab] OR octinoxate[tiab]) AND ("Skin Absorption"[MeSH] OR "systemic absorption"[tiab] OR "percutaneous absorption"[tiab] OR pharmacokinetic*[tiab] OR "plasma concentration*"[tiab] OR bioavailability[tiab] OR "endocrine disrupt*"[tiab] OR benzene[tiab] OR contamination[tiab] OR nitrosamine*[tiab])'
    openalex: sunscreen systemic absorption
    last_reviewed:
    known_reviews: []
    notes: Anchor studies - Matta et al JAMA 2019/2020. Track recalls and independent lab testing.

  - id: spf-testing-metrology
    label: SPF / UVA test methods, ISO standards, SPF>50 debate, photostability
    pubmed: '(sunscreen*[tiab] OR "Sunscreening Agents"[MeSH] OR "sun protection factor"[tiab]) AND (SPF[tiab] OR "UVA protection factor"[tiab] OR "critical wavelength"[tiab] OR "in vitro"[tiab] OR "ISO 24444"[tiab] OR "ISO 23675"[tiab] OR "ISO 23698"[tiab] OR "test method*"[tiab] OR "broad spectrum"[tiab] OR photostab*[tiab] OR "SPF 100"[tiab] OR "high SPF"[tiab]) AND (skin[tiab] OR cutaneous[tiab] OR dermat*[tiab] OR epiderm*[tiab] OR keratinocyte*[tiab] OR melanocyte*[tiab] OR fibroblast*[tiab] OR "Skin"[MeSH] OR "Skin Aging"[MeSH] OR "Skin Neoplasms"[MeSH] OR "Sunburn"[MeSH] OR sunburn[tiab] OR "sun protection"[tiab] OR "minimal erythema dose"[tiab] OR photoaging[tiab] OR photoageing[tiab]) NOT (packaging[tiab] OR "food industry"[tiab] OR postharvest[tiab] OR "shelf life"[tiab] OR agricultur*[tiab] OR crop*[tiab] OR "3D print*"[tiab] OR concrete[tiab] OR asphalt[tiab] OR bitumen[tiab] OR "building material*"[tiab] OR photovoltaic*[tiab] OR "solar cell*"[tiab] OR wastewater[tiab])'
    openalex: sunscreen SPF testing
    last_reviewed:
    known_reviews: []
    notes: Hybrid in vitro/in vivo methods and non-animal UVA testing are active standardization areas.

  - id: visible-light-hev
    label: Visible light / HEV / blue light; iron oxides; tinted sunscreen
    pubmed: '("Light"[MeSH] OR "visible light"[tiab] OR "high-energy visible"[tiab] OR "blue light"[tiab] OR HEVL[tiab] OR "iron oxide*"[tiab]) AND (sunscreen*[tiab] OR photoprotect*[tiab] OR tinted[tiab] OR pigment*[tiab] OR melasma[tiab] OR hyperpigmentation[tiab]) AND (skin[tiab] OR cutaneous[tiab] OR dermat*[tiab] OR epiderm*[tiab] OR keratinocyte*[tiab] OR melanocyte*[tiab] OR fibroblast*[tiab] OR "Skin"[MeSH] OR "Skin Aging"[MeSH] OR "Skin Neoplasms"[MeSH] OR "Sunburn"[MeSH] OR sunburn[tiab] OR "sun protection"[tiab] OR "minimal erythema dose"[tiab] OR photoaging[tiab] OR photoageing[tiab])'
    openalex: visible light photoprotection
    last_reviewed:
    known_reviews: []
    notes: Clinical endpoints in melasma and PIH; screen vs artificial (device) blue light claims.

  - id: photoprotection-skin-of-color
    label: Photoprotection in skin of color; pigmentary disorders
    pubmed: '(photoprotect*[tiab] OR sunscreen*[tiab] OR "Sunscreening Agents"[MeSH]) AND ("Skin Pigmentation"[MeSH] OR "skin of color"[tiab] OR "skin of colour"[tiab] OR Fitzpatrick[tiab] OR "dark skin"[tiab] OR melasma[tiab] OR "post-inflammatory hyperpigmentation"[tiab] OR "ethnic skin"[tiab])'
    openalex: photoprotection skin color
    last_reviewed: 2026-09-06
    known_reviews: ["Leybengrub et al, Cureus 2026 - 'Beyond Melanin: A Literature Review of Photoprotection Mechanisms and Gaps in Skin of Color' (PMID 42668981)"]
    notes: Cosmetic acceptability / white cast is a recurring adherence theme.

  - id: oral-systemic-photoprotection
    label: Oral / nutritional photoprotection (Polypodium, nicotinamide, carotenoids)
    pubmed: '(Polypodium[tiab] OR "Polypodium leucotomos"[tiab] OR fernblock[tiab] OR niacinamide[tiab] OR nicotinamide[tiab] OR "beta-carotene"[tiab] OR carotenoid*[tiab] OR astaxanthin[tiab] OR lycopene[tiab] OR "oral photoprotection"[tiab] OR "systemic photoprotection"[tiab] OR "nutritional photoprotection"[tiab]) AND (photoprotect*[tiab] OR ultraviolet[tiab] OR "UV-induced"[tiab] OR erythema[tiab] OR "minimal erythema dose"[tiab] OR photoaging[tiab]) AND (skin[tiab] OR cutaneous[tiab] OR dermat*[tiab] OR epiderm*[tiab] OR keratinocyte*[tiab] OR melanocyte*[tiab] OR fibroblast*[tiab] OR "Skin"[MeSH] OR "Skin Aging"[MeSH] OR "Skin Neoplasms"[MeSH] OR "Sunburn"[MeSH] OR sunburn[tiab] OR "sun protection"[tiab] OR "minimal erythema dose"[tiab] OR photoaging[tiab] OR photoageing[tiab])'
    openalex: oral photoprotection
    last_reviewed:
    known_reviews: []
    notes: ONTRAC (nicotinamide) is the key skin-cancer-prevention anchor; watch replication trials.

  - id: antioxidants-dna-repair
    label: Topical antioxidants; DNA-repair enzymes; photolyase
    pubmed: '("Antioxidants"[MeSH] OR antioxidant*[tiab] OR "vitamin C"[tiab] OR "ascorbic acid"[tiab] OR "vitamin E"[tiab] OR tocopherol[tiab] OR "ferulic acid"[tiab] OR "DNA repair enzyme*"[tiab] OR photolyase[tiab] OR "T4 endonuclease"[tiab] OR "8-oxoguanine"[tiab]) AND (sunscreen*[tiab] OR photoprotect*[tiab] OR topical[tiab] OR ultraviolet[tiab]) AND (skin[tiab] OR cutaneous[tiab] OR dermat*[tiab] OR epiderm*[tiab] OR keratinocyte*[tiab] OR melanocyte*[tiab] OR fibroblast*[tiab] OR "Skin"[MeSH] OR "Skin Aging"[MeSH] OR "Skin Neoplasms"[MeSH] OR "Sunburn"[MeSH] OR sunburn[tiab] OR "sun protection"[tiab] OR "minimal erythema dose"[tiab] OR photoaging[tiab] OR photoageing[tiab]) NOT (packaging[tiab] OR "food industry"[tiab] OR postharvest[tiab] OR "shelf life"[tiab] OR agricultur*[tiab] OR crop*[tiab] OR "3D print*"[tiab] OR concrete[tiab] OR asphalt[tiab] OR bitumen[tiab] OR "building material*"[tiab] OR photovoltaic*[tiab] OR "solar cell*"[tiab] OR wastewater[tiab])'
    openalex: antioxidant photoprotection
    last_reviewed:
    known_reviews: []
    notes: Distinguish marketing claims from controlled endpoint data (thymine dimers, AK counts).

  - id: skin-cancer-prevention
    label: Sunscreen & skin cancer / actinic keratosis prevention evidence
    pubmed: '(sunscreen*[tiab] OR "Sunscreening Agents"[MeSH] OR photoprotect*[tiab] OR "sun protection"[tiab]) AND ("Skin Neoplasms/prevention and control"[MeSH] OR melanoma[tiab] OR "basal cell carcinoma"[tiab] OR "squamous cell carcinoma"[tiab] OR "actinic keratos*"[tiab] OR "keratinocyte carcinoma"[tiab] OR "field cancerization"[tiab] OR "skin cancer prevention"[tiab])'
    openalex: sunscreen skin cancer
    last_reviewed: 2026-09-06
    known_reviews: ["Kumar, Pandey, Jan; JEADV Clinical Practice 2026-08-30 - 'Sun Protection Behaviours in Skin Cancer Survivors: A Systematic Review and Meta-Analysis' (DOI 10.1002/jvc2.70434)"]
    notes: Nambour trial remains the RCT anchor; look for long-term follow-up and modeling studies.

  - id: photoaging-infrared-pollution
    label: Photoaging; infrared-A; air pollution & the exposome
    pubmed: '("Skin Aging"[MeSH] OR photoaging[tiab] OR photoageing[tiab] OR "extrinsic aging"[tiab]) AND (sunscreen*[tiab] OR photoprotect*[tiab] OR infrared[tiab] OR "infrared A"[tiab] OR IRA[tiab] OR "air pollution"[tiab] OR "particulate matter"[tiab] OR exposome[tiab] OR environmental[tiab]) AND (skin[tiab] OR cutaneous[tiab] OR dermat*[tiab] OR epiderm*[tiab] OR keratinocyte*[tiab] OR melanocyte*[tiab] OR fibroblast*[tiab] OR "Skin"[MeSH] OR "Skin Aging"[MeSH] OR "Skin Neoplasms"[MeSH] OR "Sunburn"[MeSH] OR sunburn[tiab] OR "sun protection"[tiab] OR "minimal erythema dose"[tiab] OR photoaging[tiab] OR photoageing[tiab]) NOT (polymer*[tiab] OR plastic*[tiab] OR microplastic*[tiab] OR nanoplastic*[tiab] OR "tire wear"[tiab] OR asphalt[tiab] OR bitumen[tiab] OR weathering[tiab] OR coating*[tiab] OR "building material*"[tiab] OR packaging[tiab] OR postharvest[tiab])'
    openalex: sunscreen photoaging infrared
    last_reviewed:
    known_reviews: []
    notes: IR-A protection claims are contested; keep an eye on methodology critiques. NOT clause filters materials-science "photoaging" (UV weathering of plastics).

  - id: behavior-adherence-application
    label: Application amount, reapplication, adherence, real-world effectiveness
    pubmed: '(sunscreen*[tiab] OR "sun protection"[tiab] OR photoprotect*[tiab]) AND ("Patient Compliance"[MeSH] OR adherence[tiab] OR compliance[tiab] OR "application amount"[tiab] OR "2 mg/cm2"[tiab] OR reapplicat*[tiab] OR "real-world"[tiab] OR "usage behavi*"[tiab] OR "sun protective behavi*"[tiab] OR "Health Knowledge, Attitudes, Practice"[MeSH])'
    openalex: sunscreen adherence behavior
    last_reviewed:
    known_reviews: []
    notes: Gap-rich area for pragmatic trials and survey studies.

  - id: pediatric-pregnancy
    label: Sunscreen in infants, children, and pregnancy
    pubmed: '(sunscreen*[tiab] OR photoprotect*[tiab] OR "sun protection"[tiab]) AND ("Infant"[MeSH] OR "Child"[MeSH] OR pediatric[tiab] OR paediatric[tiab] OR children[tiab] OR infant*[tiab] OR neonat*[tiab] OR "Pregnancy"[MeSH] OR pregnan*[tiab] OR breastfeeding[tiab])'
    openalex: sunscreen children pregnancy
    last_reviewed:
    known_reviews: []
    notes: Regulatory guidance (age <6 months) vs practical counseling; mineral-only messaging.

  - id: environmental-reef
    label: UV filters & the marine environment; coral reef; ecotoxicology; bans
    pubmed: '(sunscreen*[tiab] OR "Sunscreening Agents"[MeSH] OR oxybenzone[tiab] OR "benzophenone-3"[tiab] OR octinoxate[tiab] OR "UV filter*"[tiab]) AND ("Anthozoa"[MeSH] OR coral*[tiab] OR reef*[tiab] OR aquatic[tiab] OR ecotoxic*[tiab] OR "marine environment"[tiab] OR "environmental impact"[tiab] OR "Water Pollutants, Chemical"[MeSH])'
    openalex: sunscreen coral reef
    last_reviewed: 2026-09-06
    known_reviews: ["Jin, Hong, Lee; Comp Biochem Physiol C 2026-08-31 - 'Benzophenone-type UV filters in aquatic ecosystems: Sources, toxicological impacts, and interactions with coexisting...' (PMID 42674295)"]
    notes: Separate legislative/advocacy claims from peer-reviewed environmental toxicology.

  - id: vitamin-d-tradeoff
    label: Sunscreen use and vitamin D status
    pubmed: '(sunscreen*[tiab] OR "sun protection"[tiab] OR photoprotect*[tiab] OR "sun exposure"[tiab]) AND ("vitamin D"[ti] OR "25-hydroxyvitamin D"[ti] OR "vitamin D deficiency"[ti] OR "vitamin D status"[tiab] OR "serum 25(OH)D"[tiab])'
    openalex: sunscreen vitamin D
    last_reviewed:
    known_reviews: []
    notes: Real-world use rarely lowers 25(OH)D; useful counseling-myth rebuttal material. Vitamin D restricted to title to cut generic deficiency-disease noise.

  - id: misinformation-public-health
    label: Sunscreen misinformation, social media, and sun-seeking trends
    pubmed: '(sunscreen*[tiab] OR "sun protection"[tiab] OR photoprotect*[tiab] OR "sun exposure"[tiab] OR tanning[tiab]) AND ("Communication"[MeSH] OR misinformation[tiab] OR "social media"[tiab] OR "Social Media"[MeSH] OR TikTok[tiab] OR Instagram[tiab] OR YouTube[tiab] OR "public perception"[tiab] OR "health communication"[tiab] OR infodemic[tiab] OR "sunscreen avoidance"[tiab])'
    openalex: sunscreen misinformation social media
    last_reviewed:
    known_reviews: []
    notes: High-visibility Viewpoint/Commentary territory; pair with a content analysis if feasible.

  - id: photodermatoses-drug-photosensitivity
    label: Photodermatoses, drug-induced photosensitivity, cutaneous lupus
    pubmed: '("Photosensitivity Disorders"[MeSH] OR photodermat*[tiab] OR "polymorphous light eruption"[tiab] OR "polymorphic light eruption"[tiab] OR "solar urticaria"[tiab] OR "chronic actinic dermatitis"[tiab] OR "drug-induced photosensitivity"[tiab] OR photoallerg*[tiab] OR phototoxic*[tiab] OR "cutaneous lupus"[tiab]) AND (sunscreen*[tiab] OR photoprotect*[tiab] OR management[tiab] OR "sun protection"[tiab])'
    openalex: photodermatoses photoprotection
    last_reviewed:
    known_reviews: []
    notes: Photopatch testing updates belong here and overlap with Contact Dermatitis.

  - id: formulation-vehicle-photostability
    label: Formulation & vehicle (spray, powder, stick), photostability, mineral filters
    pubmed: '(sunscreen*[tiab] OR "Sunscreening Agents"[MeSH]) AND (formulation*[tiab] OR vehicle*[tiab] OR spray[tiab] OR aerosol[tiab] OR powder*[tiab] OR stick[tiab] OR cosmetic*[tiab] OR sensory[tiab] OR "cosmetic elegance"[tiab] OR photostab*[tiab] OR "film formation"[tiab] OR nanoparticle*[tiab] OR "zinc oxide"[tiab] OR "titanium dioxide"[tiab]) AND (skin[tiab] OR cutaneous[tiab] OR dermat*[tiab] OR epiderm*[tiab] OR keratinocyte*[tiab] OR melanocyte*[tiab] OR fibroblast*[tiab] OR "Skin"[MeSH] OR "Skin Aging"[MeSH] OR "Skin Neoplasms"[MeSH] OR "Sunburn"[MeSH] OR sunburn[tiab] OR "sun protection"[tiab] OR "minimal erythema dose"[tiab] OR photoaging[tiab] OR photoageing[tiab]) NOT (packaging[tiab] OR "food industry"[tiab] OR postharvest[tiab] OR "shelf life"[tiab] OR agricultur*[tiab] OR crop*[tiab] OR "3D print*"[tiab] OR concrete[tiab] OR asphalt[tiab] OR bitumen[tiab] OR "building material*"[tiab] OR photovoltaic*[tiab] OR "solar cell*"[tiab] OR wastewater[tiab] OR textile*[tiab] OR fabric*[tiab])'
    openalex: sunscreen formulation photostability
    last_reviewed:
    known_reviews: []
    notes: Nanoparticle penetration safety and spray inhalation exposure recur; watch EU nano rules.
